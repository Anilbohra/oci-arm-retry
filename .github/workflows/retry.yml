name: OCI ARM retry

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Write OCI config
        env:
          RAW_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          RAW_USER: ${{ secrets.OCI_USER_OCID }}
          RAW_FP: ${{ secrets.OCI_FINGERPRINT }}
          RAW_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          RAW_STACK: ${{ secrets.OCI_STACK_ID }}
        run: |
          mkdir -p ~/.oci
          clean() { printf '%s' "$1" | tr -d '[:space:]' | sed 's/^[a-z]*=//'; }
          U=$(clean "$RAW_USER")
          F=$(clean "$RAW_FP")
          T=$(clean "$RAW_TENANCY")
          S=$(clean "$RAW_STACK")

          printf '%s\n' "$RAW_KEY" | tr -d '\r' | sed '/OCI_API_KEY/d' > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem

          {
            echo "[DEFAULT]"
            echo "user=$U"
            echo "fingerprint=$F"
            echo "tenancy=$T"
            echo "region=ap-mumbai-1"
            echo "key_file=$HOME/.oci/key.pem"
          } > ~/.oci/config
          chmod 600 ~/.oci/config

          echo "TENANCY_ID=$T" >> "$GITHUB_ENV"
          echo "STACK_ID=$S" >> "$GITHUB_ENV"

          echo "Config structure:"
          sed 's/=.*/=<set>/' ~/.oci/config
          echo "user starts with: ${U:0:10}"
          echo "tenancy starts with: ${T:0:13}"
          echo "stack starts with: ${S:0:13}"
          echo "fingerprint length: ${#F} (should be 47)"
          echo "key first line: $(head -1 ~/.oci/key.pem)"
          echo "key last line:  $(tail -1 ~/.oci/key.pem)"

      - name: Check Oracle login
        run: |
          echo "Testing connection to Oracle..."
          oci os ns get && echo "LOGIN OK"

      - name: Try to create the server
        run: |
          set +e

          find_instance() {
            oci compute instance list --compartment-id "$TENANCY_ID" --all \
              --query 'data[?"display-name"==`"neomailserver"` && "lifecycle-state"!=`"TERMINATED"`] | [0].id' \
              --raw-output
          }

          announce_and_stop() {
            ID="$1"
            IP=$(oci compute instance list-vnics --instance-id "$ID" \
                  --query 'data[0]."public-ip"' --raw-output)
            echo "SERVER EXISTS. Public IP: $IP"
            gh issue create --title "Oracle ARM server created" \
              --body "neomailserver is up. Public IP: ${IP:-check the Oracle console}"
            gh workflow disable "$GITHUB_WORKFLOW"
          }

          ID=$(find_instance)
          if [ -n "$ID" ] && [ "$ID" != "null" ]; then
            announce_and_stop "$ID"
            exit 0
          fi

          echo "No server yet - starting an apply job..."
          OUT=$(oci resource-manager job create-apply-job \
            --stack-id "$STACK_ID" \
            --execution-plan-strategy AUTO_APPROVED \
            --wait-for-state SUCCEEDED --wait-for-state FAILED \
            --max-wait-seconds 900)

          JOB_ID=$(echo "$OUT" | jq -r '.data.id // empty')
          STATE=$(echo "$OUT" | jq -r '.data."lifecycle-state" // empty')
          echo "Job: ${JOB_ID:-none}"
          echo "Result: ${STATE:-no answer}"

          if [ "$STATE" = "FAILED" ] && [ -n "$JOB_ID" ]; then
            echo "--- Reason from Oracle ---"
            oci resource-manager job get-job-logs-content --job-id "$JOB_ID" \
              --query data --raw-output | grep -iE "error|capacity|limit" | tail -5
          fi

          if [ "$STATE" = "SUCCEEDED" ]; then
            sleep 30
            ID=$(find_instance)
            announce_and_stop "$ID"
          fi
          exit 0
